<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Puzzle</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style3.css">
</head>
<body>

    <!-- Background Glow -->
    <div class="bg-glow"></div>

    <!-- Header -->
     <button class="btn-kembali" onclick="window.location.href='dashboard4.html'">
    Back
</button>
    <header class="header">
        <div class="logo">
             Memory Puzzle
        </div>

        <div class="header-desc">
            Take a photo • Solve the puzzle • Keep the memory
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-layout">

        <!-- Camera Section -->
        <section class="card camera-card">

            <div class="card-header">
                <span class="step">01</span>
                <h2>Take a Photo</h2>
            </div>

            <div class="camera-wrapper">

                <video
                    id="camera"
                    autoplay
                    playsinline>
                </video>

                <canvas
                    id="captureCanvas"
                    style="display:none;">
                </canvas>

            </div>

            <button id="startCamera" class="primary-btn">
                Start Camera
            </button>

            <button id="captureBtn" class="primary-btn">
                Shot
            </button>

        </section>

        <!-- Puzzle Section -->
        <section class="card puzzle-card">

            <div class="card-header">
<span class="step">02</span>
                <h2>Puzzle Time</h2>
            </div>

            <p class="subtitle">
                Arrange the pieces back into the original photo.
            </p>

            <div id="puzzleBoard">

                <!-- Puzzle Pieces Here -->

            </div>

            <div class="status-area">

                <span id="statusText">
                    Waiting for photo...
                </span>

            </div>

        </section>

        <!-- Result Section -->
        <section class="card result-card">

            <div class="card-header">
                <span class="step">03</span>
                <h2>Completed</h2>
            </div>

            <div class="result-frame">

                <img
                    id="completedImage"
                    src=""
                    alt="Result">

            </div>

            <p id="completeMessage">
                Finish the puzzle to reveal your memory.
            </p>
            <button id="saveMemoryBtn" class="save-memory-btn" disabled>
    📌 Add to Scrapbook
</button>

        </section>

    </main>

    <!-- Memory Gallery -->
    <section class="gallery-section">

        <div class="gallery-header">
            <h2>My Memories</h2>
            <p>Every completed puzzle becomes a memory.</p>
        </div>

        <div class="gallery-grid">

            <div class="memory-slot"></div>
            <div class="memory-slot"></div>
            <div class="memory-slot"></div>

            <div class="memory-slot"></div>
            <div class="memory-slot"></div>
            <div class="memory-slot"></div>

        </div>

    </section>

    <!-- JS -->
    <script>/* =========================
   ELEMENTS
========================= */

const video = document.getElementById("camera");
const canvas = document.getElementById("captureCanvas");

const startCameraBtn =
document.getElementById("startCamera");

const captureBtn =
document.getElementById("captureBtn");

const completedImage =
document.getElementById("completedImage");

const statusText =
document.getElementById("statusText");

const saveMemoryBtn =
document.getElementById(
    "saveMemoryBtn"
);



let stream = null;

let capturedImage = null;

const GRID_SIZE = 3;
      
let selectedPiece = null;

/* =========================
   START CAMERA
========================= */

startCameraBtn.addEventListener(
"click",
async () => {

    try {

        stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"user"
            },

            audio:false

        });

        video.srcObject = stream;

        statusText.textContent =
        "Camera ready 📷";

    }

    catch(error){

        console.error(error);

        statusText.textContent =
        "Unable to access camera.";

        alert(
        "Camera permission denied or not supported."
        );

    }

}
);


/* =========================
   CAPTURE PHOTO
========================= */

captureBtn.addEventListener(
"click",
() => {

    if(!stream){

        alert(
        "Please start the camera first."
        );

        return;
    }

    const width =
    video.videoWidth;

    const height =
    video.videoHeight;

    canvas.width = width;
    canvas.height = height;

    const ctx =
    canvas.getContext("2d");

    ctx.drawImage(
        video,
        0,
        0,
        width,
        height
    );

    const imageData =
    canvas.toDataURL(
        "image/png"
    );

    completedImage.src =
    imageData;
  capturedImage = imageData;

createPuzzle(imageData);

  
    statusText.textContent =
    "Photo captured successfully 📸";

    console.log(
    "Photo captured!"
    );

}
);
      function shuffleArray(array){
      

    for(
        let i = array.length - 1;
        i > 0;
        i--
    ){

        const j =
        Math.floor(
Math.random() * (i + 1)
        );

        [array[i], array[j]] =
        [array[j], array[i]];
    }

    return array;
      }

      function createPuzzle(imageSrc){

    const board =
    document.getElementById(
        "puzzleBoard"
    );

    board.innerHTML = "";

    const pieces = [];

    for(
        let row = 0;
        row < GRID_SIZE;
        row++
    ){

        for(
            let col = 0;
            col < GRID_SIZE;
            col++
        ){

            pieces.push({
                row,
                col
            });

        }

    }

    shuffleArray(pieces);

    pieces.forEach((piece,index) => {

    const div =
    document.createElement("div");

    div.classList.add(
        "puzzle-piece"
    );

    const img = document.createElement("img");

img.src = imageSrc;

img.style.width = `${GRID_SIZE * 100}%`;
img.style.height = `${GRID_SIZE * 100}%`;

img.style.objectFit = "cover";

img.style.transform =
`translate(${-piece.col * 100 / GRID_SIZE}%, ${-piece.row * 100 / GRID_SIZE}%)`;

div.appendChild(img);

    div.dataset.correctIndex =
    (piece.row * GRID_SIZE)
    + piece.col;

    div.dataset.currentIndex =
    index;

    div.addEventListener(
        "click",
        () => selectPiece(div)
    );

    board.appendChild(div);

  });

 }

      
      function selectPiece(piece){

    if(!selectedPiece){

        selectedPiece = piece;

        piece.style.outline =
        "4px solid #3b82f6";

        return;
    }

    if(selectedPiece === piece){

        piece.style.outline =
        "none";

        selectedPiece = null;

        return;
  }
swapPieces(
        selectedPiece,
        piece
    );

    selectedPiece.style.outline =
"none";

selectedPiece = null;

checkPuzzle();

function puzzleCompleted(){

    statusText.textContent =
    "🎉 Puzzle Completed!";

    addToMemoryGallery();

}

  }
function swapPieces(piece1, piece2){

    const img1 = piece1.querySelector("img");
    const img2 = piece2.querySelector("img");

    const temp = img1.style.transform;
    img1.style.transform = img2.style.transform;
    img2.style.transform = temp;

    const correct1 = piece1.dataset.correctIndex;
    piece1.dataset.correctIndex = piece2.dataset.correctIndex;
    piece2.dataset.correctIndex = correct1;
}
function checkPuzzle(){

    const pieces =
    document.querySelectorAll(
        ".puzzle-piece"
    );

    let solved = true;

    pieces.forEach((piece,index)=>{

        if(
            Number(piece.dataset.correctIndex)
            !== index
        ){
            solved = false;
        }

    });

    if(solved){

        statusText.textContent =
        "🎉 Puzzle Completed!";

        saveMemoryBtn.disabled = false;

    }

}
saveMemoryBtn.addEventListener(
"click",
() => {

    addToMemoryGallery();

    saveMemoryBtn.disabled = true;

}
);
function addToMemoryGallery(){

    const slots =
    document.querySelectorAll(
        ".memory-slot"
    );

    for(
        let i = 0;
        i < slots.length;
        i++
    ){

        if(
            slots[i].children.length === 0
        ){

            slots[i].innerHTML = `
                <img
                src="${capturedImage}"
                alt="Memory">
            `;

            break;

        }

    }

}
    </script>
</body>
</html>
