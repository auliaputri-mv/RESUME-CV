<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Felix</title>


    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Icon -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="style4.css">
    

</head>

<body>
<div class="stars"></div>

<!-- ================= CAKE ================= -->
 <button class="btn-kembali" onclick="window.location.href='index.html'">
    Back
</button>

<section class="cake-section">

<h2>

I can't give a real gift or cake,
so i just made it
online. I hope you like it 

</h2>




    <div class="foto-container">

        <img src="kuwe.png" class="srt" id="cake">

        <img src="surat1.png" id="fotoMasuk" class="kue">

<img src="kamera.png" id="kamerabejir" class="kue">



    </div>



<div id="balloons"></div>
    
</section>

<script>

// Tambahkan bounce saat load
window.addEventListener("load", () => {
    document.getElementById("cake").classList.add("bounce", "smooth-click");
    document.getElementById("fotoMasuk").classList.add("bounce", "smooth-click");
    document.getElementById("kamerabejir").classList.add("bounce", "smooth-click");
});
window.addEventListener("pageshow", () => {
    document.getElementById("fotoMasuk").style.opacity = "1";
    document.getElementById("fotoMasuk").style.transform = "";

    document.getElementById("kamerabejir").style.opacity = "1";
    document.getElementById("kamerabejir").style.transform = "";
});

// Efek klik dengan animasi sebelum pindah halaman
function smoothRedirect(element, targetPage) {
    element.addEventListener("click", function() {
        this.style.transform = "scale(1.2)";
        this.style.opacity = "0";
        setTimeout(() => {
            window.location.href = targetPage;
        }, 600); // delay biar animasi selesai dulu
    });
}

window.addEventListener("load",()=>{
    const h1=document.querySelectorAll(".title h2");

    setTimeout(()=>{
h1[0].classList.add("show");
},1700);

});


// ===================================
// BALLOON ANIMATION
// ===================================

const cake=document.getElementById("cake");

const balloonContainer=document.getElementById("balloons");

const colors=[

"#ff5e7e",
"#ff9e3d",
"#ffd93d",
"#6bd66b",
"#61b9ff",
"#8b6cff",
"#ff7fd1"

];

cake.addEventListener("click",()=>{

createBalloons();

});

function createBalloons(){

balloonContainer.innerHTML="";

for(let i=0;i<55;i++){

let balloon=document.createElement("div");

balloon.classList.add("balloon");

balloon.style.left=Math.random()*100+"%";

balloon.style.background=
colors[Math.floor(Math.random()*colors.length)];

balloon.style.animationDuration=
(2.5+Math.random()*1.2)+"s";

balloon.style.animationDelay = (i * 0.03) + "s";

const scale = 0.6 + Math.random() * 0.9;
balloon.style.setProperty("--scale", scale);

balloonContainer.appendChild(balloon);

}

balloon.addEventListener("animationend", () => {
    balloon.remove();
});

}

// ===================================
// CAKE EFFECT
// ===================================

cake.addEventListener("mousedown",()=>{

cake.style.transform="scale(.96)";

});

cake.addEventListener("mouseup",()=>{

cake.style.transform="scale(1)";

});

cake.addEventListener("mouseleave",()=>{

cake.style.transform="scale(1)";

});

const starsContainer = document.querySelector(".stars");

for(let i = 0; i < 60; i++){

    const star = document.createElement("div");

    star.classList.add("star");

    star.style.left = Math.random()*100 + "%";
    star.style.top = Math.random()*100 + "%";

    star.style.animationDuration =
        (1 + Math.random()*3) + "s";

    star.style.animationDelay =
        Math.random()*5 + "s";

    starsContainer.appendChild(star);

}

const surat = document.getElementById("fotoMasuk");

surat.addEventListener("click", function () {

    surat.classList.add("zoomOut");

    setTimeout(() => {
        window.location.href = "dashboard5.html";
    }, 500);

});

const kamera = document.getElementById("kamerabejir");

kamera.addEventListener("click", function () {

    kamera.classList.add("zoomOut");

    setTimeout(() => {
        window.location.href = "dashboard3.html";
    }, 500);

});
</script>

</body>

</html>
